<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>/viva — Technical Oral Examiner Terminal</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: "Courier New", Courier, monospace; margin: 0; padding: 24px; }
    .terminal { max-width: 800px; margin: 0 auto; background: #1e293b; border-radius: 8px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .term-header { background: #0f172a; padding: 12px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }
    .term-title { margin-left: 8px; font-size: 13px; color: #94a3b8; font-weight: bold; }
    .term-body { padding: 20px; min-height: 400px; max-height: 600px; overflow-y: auto; font-size: 14px; line-height: 1.6; }
    .cmd-line { color: #38bdf8; font-weight: bold; margin-bottom: 12px; }
    .examiner-msg { color: #facc15; margin: 8px 0; }
    .user-msg { color: #4ade80; margin: 8px 0; }
    .score-badge { color: #f43f5e; font-weight: bold; font-size: 16px; margin-top: 16px; padding: 12px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; }
    .term-input-row { display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: #0f172a; border-top: 1px solid #334155; }
    .term-prompt { color: #38bdf8; font-weight: bold; }
    .term-input { flex: 1; background: transparent; border: none; outline: none; color: #f8fafc; font-family: inherit; font-size: 14px; }
    .btn-send { background: #2563eb; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="term-header">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
      <span class="term-title">bash — /viva thermo-notes.pdf — Examiner: Soubhagyya</span>
    </div>
    <div class="term-body" id="termBody">
      <div class="cmd-line">&gt; /viva thermo-notes.pdf</div>
      <div>Reading notes. Asking 5 questions, one at a time.</div>
      <br>
      <div id="activeQuestion" class="examiner-msg">Q1. State the physical significance of the Clausius inequality and what it indicates about real cycles.</div>
    </div>
    <div class="term-input-row" id="inputRow">
      <span class="term-prompt">&gt;</span>
      <input type="text" id="userInput" class="term-input" placeholder="Type your answer here and press Enter..." autofocus>
      <button id="sendBtn" class="btn-send">Submit</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "Q1. State the physical significance of the Clausius inequality and what it indicates about real cycles.",
        keywords: ["dq/t", "entropy", "less than", "zero", "irreversible"],
        ideal: "The cyclic integral of dQ/T <= 0 guarantees that no cycle can generate negative entropy, confirming irreversibility in all real cycles.",
        rev: "Revise Section 2: Clausius Inequality (Page 6-10)."
      },
      {
        q: "Q2. Why can no heat engine operating between two finite temperatures beat the Carnot efficiency?",
        keywords: ["second law", "kelvin", "planck", "refrigerator", "reservoir"],
        ideal: "The Carnot efficiency represents the theoretical maximum limit set by the Second Law; any engine exceeding it could run a reversed refrigerator creating net work from a single heat reservoir, violating Kelvin-Planck.",
        rev: "Revise Page 14: Carnot theorem & reversible refrigerator."
      },
      {
        q: "Q3. What is the Joule-Thomson coefficient for an ideal gas undergoing steady throttling, and does temperature drop?",
        keywords: ["zero", "no change", "constant", "same"],
        ideal: "For an ideal gas mu_JT = 0; because enthalpy depends solely on temperature, throttling an ideal gas produces zero temperature change.",
        rev: "Revise Page 16: Throttling & Joule-Thomson effect."
      },
      {
        q: "Q4. Can the entropy of a working fluid decrease during a reversible process?",
        keywords: ["yes", "heat transfer", "cooling", "dq/t"],
        ideal: "Yes, during reversible heat rejection (cooling) dS = dQ/T < 0 for the system. Total universe entropy remains constant.",
        rev: "Revise Page 7: Principle of Increase of Entropy."
      },
      {
        q: "Q5. Why must the four processes in the Carnot cycle alternate between isothermal and isentropic stages?",
        keywords: ["temperature", "cool", "isentropic", "expansion", "reservoir"],
        ideal: "Isothermal stages transfer heat at constant reservoir temperatures, while isentropic stages change the fluid temperature between T_H and T_L without any irreversibilities.",
        rev: "Revise Page 12: Carnot process stages."
      }
    ];

    let currentIdx = 0;
    let score = 0;
    const revisions = [];

    const body = document.getElementById('termBody');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const inputRow = document.getElementById('inputRow');

    function submitAnswer() {
      const val = input.value.trim();
      if (!val) return;

      const userLine = document.createElement('div');
      userLine.className = 'user-msg';
      userLine.textContent = '> ' + val;
      body.appendChild(userLine);

      const q = questions[currentIdx];
      const valLower = val.toLowerCase();
      const isFull = q.keywords.some(k => valLower.includes(k));

      const fb = document.createElement('div');
      fb.className = 'examiner-msg';

      if (isFull) {
        fb.textContent = 'Examiner: Correct. ' + q.ideal + ' (+1.0)';
        score += 1.0;
      } else if (val.length > 8) {
        fb.textContent = 'Examiner: Partly. ' + q.ideal + ' (+0.5)';
        score += 0.5;
        revisions.push(q.rev);
      } else {
        fb.textContent = 'Examiner: Incorrect. ' + q.ideal + ' (+0.0)';
        revisions.push(q.rev);
      }
      body.appendChild(fb);

      currentIdx++;
      input.value = '';

      if (currentIdx < questions.length) {
        const nextQ = document.createElement('div');
        nextQ.className = 'examiner-msg';
        nextQ.style.marginTop = '14px';
        nextQ.textContent = questions[currentIdx].q;
        body.appendChild(nextQ);
      } else {
        inputRow.style.display = 'none';
        const finalCard = document.createElement('div');
        finalCard.className = 'score-badge';
        const revList = [...new Set(revisions)].join(' | ');
        finalCard.innerHTML = `<strong>FINAL VIVA RESULT:</strong> Score: ${score.toFixed(1)}/5.0 (${Math.round((score/5)*100)}%)<br><br>Targeted Revision: ${revList || 'All topics mastered! Ready for examination.'}`;
        body.appendChild(finalCard);
      }

      body.scrollTop = body.scrollHeight;
    }

    sendBtn.addEventListener('click', submitAnswer);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAnswer();
    });
  </script>
</body>
</html>
